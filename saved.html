<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Scanner - Saved Matches</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --sys-bg:        #F2F2F7;
      --sys-bg2:       #FFFFFF;
      --sys-bg3:       #F2F2F7;
      --sys-fill:      rgba(120,120,128,0.12);
      --sys-fill2:     rgba(120,120,128,0.08);
      --sys-sep:       rgba(60,60,67,0.12);
      --sys-label:     #000000;
      --sys-label2:    rgba(60,60,67,0.6);
      --sys-label3:    rgba(60,60,67,0.3);
      --sys-blue:      #007AFF;
      --sys-blue-bg:   rgba(0,122,255,0.10);
      --sys-green:     #34C759;
      --sys-green-bg:  rgba(52,199,89,0.10);
      --sys-orange:    #FF9500;
      --sys-orange-bg: rgba(255,149,0,0.10);
      --sys-red:       #FF3B30;
      --sys-red-bg:    rgba(255,59,48,0.10);
      --r-card:        14px;
      --r-btn:         10px;
      --r-pill:        100px;
      --shadow-pop:    0 8px 40px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.08);
      --font: 'General Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--sys-bg);
      color: var(--sys-label);
      padding: 24px;
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      background: var(--sys-bg2);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-pop);
    }

    header {
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--sys-sep);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--sys-label);
      margin-bottom: 3px;
    }

    .header-meta {
      font-size: 13px;
      color: var(--sys-label2);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--sys-blue);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font);
      transition: opacity 0.15s;
    }

    button:hover {
      opacity: 0.85;
    }

    button.secondary {
      background: var(--sys-fill);
      color: var(--sys-label);
    }

    button.warning {
      background: var(--sys-orange-bg);
      color: var(--sys-orange);
    }

    button.danger {
      background: var(--sys-red);
      color: white;
    }

    /* Stats strip */
    .stats-bar {
      display: flex;
      border-bottom: 1px solid var(--sys-sep);
    }

    .stat {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px 20px;
      border-right: 1px solid var(--sys-sep);
    }

    .stat:last-child {
      border-right: none;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--sys-label2);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 3px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--sys-label);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .stat-value--hiring { color: var(--sys-green); }
    .stat-value--devops { color: var(--sys-blue); }
    .stat-value--duplicates { color: var(--sys-orange); }

    /* Filter bar */
    .controls {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--sys-sep);
      background: var(--sys-bg3);
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex: 1;
      flex-wrap: wrap;
    }

    .filter-input {
      background: var(--sys-bg2);
      border: 1px solid var(--sys-sep);
      color: var(--sys-label);
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-family: var(--font);
      flex: 1;
      min-width: 200px;
      outline: none;
    }

    .filter-input::placeholder {
      color: var(--sys-label3);
    }

    select {
      background: var(--sys-bg2);
      border: 1px solid var(--sys-sep);
      color: var(--sys-label);
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-family: var(--font);
      cursor: pointer;
    }

    .matches-container {
      overflow-x: auto;
      max-height: calc(100vh - 380px);
      overflow-y: auto;
      position: relative;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 10;
    }

    th {
      text-align: left;
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      color: var(--sys-label2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      user-select: none;
      position: relative;
      background: var(--sys-bg3);
      border-bottom: 1px solid var(--sys-sep);
    }

    th:hover {
      background: var(--sys-fill);
    }

    th.sortable::after {
      content: ' ⇅';
      opacity: 0.3;
      font-size: 11px;
    }

    th.sorted-asc::after {
      content: ' ▲';
      opacity: 1;
      color: var(--sys-blue);
    }

    th.sorted-desc::after {
      content: ' ▼';
      opacity: 1;
      color: var(--sys-blue);
    }

    th input[type="checkbox"] {
      cursor: pointer;
      width: 15px;
      height: 15px;
      accent-color: var(--sys-blue);
    }

    td {
      padding: 13px 14px;
      border-bottom: 1px solid var(--sys-sep);
      vertical-align: top;
      font-size: 13px;
    }

    tr:hover td {
      background: var(--sys-fill2);
    }

    tr.selected td {
      background: var(--sys-blue-bg);
    }

    tr:last-child td {
      border-bottom: none;
    }

    .col-select {
      width: 40px;
      text-align: center;
    }

    .col-select input[type="checkbox"] {
      cursor: pointer;
      width: 15px;
      height: 15px;
      accent-color: var(--sys-blue);
    }

    .col-timestamp {
      color: var(--sys-label2);
      font-size: 12px;
      white-space: nowrap;
      min-width: 120px;
    }

    .col-keywords {
      min-width: 160px;
    }

    .col-snippet {
      max-width: 800px;
      color: var(--sys-label2);
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .col-source-url {
      min-width: 100px;
      white-space: nowrap;
    }

    .col-emails {
      min-width: 180px;
    }

    .col-actions {
      white-space: nowrap;
      min-width: 140px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.01em;
      margin-bottom: 4px;
    }

    .badge-hiring {
      background: var(--sys-red-bg);
      color: var(--sys-red);
    }

    .badge-devops {
      background: var(--sys-blue-bg);
      color: var(--sys-blue);
    }

    .email-link {
      color: var(--sys-blue);
      text-decoration: none;
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .email-link:hover {
      text-decoration: underline;
    }

    .btn-open {
      display: inline-flex;
      align-items: center;
      background: var(--sys-green);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s;
      margin-right: 6px;
    }

    .btn-open:hover {
      opacity: 0.85;
    }

    .btn-delete {
      background: var(--sys-red-bg);
      color: var(--sys-red);
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: opacity 0.15s;
    }

    .btn-delete:hover {
      opacity: 0.75;
    }

    .empty-state {
      padding: 60px 40px;
      text-align: center;
    }

    .empty-state h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--sys-label2);
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--sys-label3);
      font-size: 13px;
    }

    .bulk-actions {
      background: var(--sys-orange-bg);
      padding: 10px 16px;
      border-bottom: 1px solid var(--sys-sep);
      display: none;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .bulk-actions.visible {
      display: flex;
    }

    .bulk-actions-text {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      color: var(--sys-orange);
    }

    .pagination {
      padding: 12px 20px;
      border-top: 1px solid var(--sys-sep);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pagination-info {
      font-size: 13px;
      color: var(--sys-label2);
    }

    .pagination-controls {
      display: flex;
      gap: 6px;
    }

    .pagination-controls button {
      background: var(--sys-fill);
      color: var(--sys-label);
    }

    .pagination-controls button:disabled {
      cursor: not-allowed;
      opacity: 0.35;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Saved Matches</h1>
        <div class="header-meta" id="total-count">0 matches saved</div>
      </div>
      <div class="header-actions">
        <button id="btn-copy-emails" class="secondary">Copy All Emails</button>
        <button id="btn-export" class="secondary">Export JSON</button>
        <button id="btn-export-csv" class="secondary">Export CSV</button>
        <button id="btn-clean-duplicates" class="warning">Clean Duplicates</button>
        <button id="btn-clear-all" class="danger">Clear All</button>
        <button id="btn-refresh">Refresh</button>
      </div>
    </header>

    <div class="stats-bar">
      <div class="stat">
        <span class="stat-label">Total</span>
        <span class="stat-value" id="stat-total">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Hiring Signal</span>
        <span class="stat-value stat-value--hiring" id="stat-hiring">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">DevOps Only</span>
        <span class="stat-value stat-value--devops" id="stat-devops">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Duplicates</span>
        <span class="stat-value stat-value--duplicates" id="stat-duplicates">0</span>
      </div>
    </div>

    <div class="controls">
      <div class="filter-group">
        <input type="text" class="filter-input" id="filter-input" placeholder="Search matches…">
        <select id="filter-type">
          <option value="all">All Matches</option>
          <option value="hiring">Hiring Posts Only</option>
          <option value="devops">DevOps Only</option>
        </select>
        <select id="filter-skill">
          <option value="all">All Skills</option>
          <option value="docker">Docker</option>
          <option value="kubernetes">Kubernetes</option>
          <option value="k8s">K8s</option>
          <option value="terraform">Terraform</option>
          <option value="ansible">Ansible</option>
          <option value="jenkins">Jenkins</option>
          <option value="github actions">GitHub Actions</option>
          <option value="aws">AWS</option>
          <option value="azure">Azure</option>
          <option value="gcp">GCP</option>
          <option value="python">Python</option>
          <option value="bash">Bash</option>
          <option value="golang">Golang</option>
          <option value="java">Java</option>
          <option value="prometheus">Prometheus</option>
          <option value="grafana">Grafana</option>
          <option value="helm">Helm</option>
          <option value="argocd">ArgoCD</option>
        </select>
        <select id="filter-duplicate">
          <option value="all">All Posts</option>
          <option value="originals-only">Originals Only</option>
          <option value="duplicates-only">Duplicates Only</option>
        </select>
        <select id="sort-by">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
        </select>
        <select id="page-size">
          <option value="25">25 per page</option>
          <option value="50" selected>50 per page</option>
          <option value="100">100 per page</option>
          <option value="all">Show All</option>
        </select>
      </div>
    </div>

    <div class="bulk-actions" id="bulk-actions">
      <span class="bulk-actions-text" id="bulk-actions-text">0 rows selected</span>
      <button id="btn-delete-selected" class="danger">Delete Selected</button>
      <button id="btn-export-selected" class="secondary">Export Selected (JSON)</button>
      <button id="btn-export-selected-csv" class="secondary">Export Selected (CSV)</button>
      <button id="btn-deselect-all" class="secondary">Deselect All</button>
    </div>

    <div class="matches-container" id="matches-container">
      <div class="empty-state">
        <h2>No saved matches yet</h2>
        <p>Matches will appear here as you browse LinkedIn</p>
      </div>
    </div>

    <div class="pagination" id="pagination" style="display:none;">
      <div class="pagination-info" id="pagination-info">Showing 1-50 of 100</div>
      <div class="pagination-controls">
        <button id="btn-first-page">First</button>
        <button id="btn-prev-page">← Prev</button>
        <button id="btn-next-page">Next →</button>
        <button id="btn-last-page">Last</button>
      </div>
    </div>
  </div>

  <!-- Shared utilities -->
  <script src="shared/utils.js"></script>
  <script src="shared/storageUtils.js"></script>
  <script src="shared/formatters.js"></script>

  <script src="saved.js"></script>
</body>
</html>
