<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <text x="20" y="28" font-size="15" font-weight="700" fill="#263238">Badge &amp; pill reference</text>

  <!-- Row 1: hiring -->
  <rect x="20" y="46" width="250" height="22" rx="11" fill="#2e7d32"/>
  <text x="30" y="61" font-size="11" font-weight="600" fill="#fff">🔥 Hiring · devops, terraform + hiring</text>
  <text x="300" y="61" font-size="12" fill="#455a64">Matched with an explicit hiring signal in the post</text>

  <!-- Row 2: devops (no hiring phrase) -->
  <rect x="20" y="82" width="190" height="22" rx="11" fill="#2e7d32"/>
  <text x="30" y="97" font-size="11" font-weight="600" fill="#fff">🔥 DevOps · sre, kubernetes</text>
  <text x="300" y="97" font-size="12" fill="#455a64">High-confidence match without an explicit hiring phrase</text>

  <!-- Row 3: AI verified -->
  <rect x="20" y="118" width="190" height="22" rx="11" fill="#2e7d32"/>
  <text x="30" y="133" font-size="11" font-weight="600" fill="#fff">🤖 DevOps · devops, jenkins</text>
  <text x="300" y="133" font-size="12" fill="#455a64">Gray-zone post confirmed as a job posting by local AI</text>

  <!-- Row 4: invalid -->
  <rect x="20" y="154" width="200" height="22" rx="11" fill="#ff9800"/>
  <text x="30" y="169" font-size="11" font-weight="600" fill="#fff">⚠️ Not valid · no sponsorship</text>
  <text x="300" y="169" font-size="12" fill="#455a64">Contains a disqualifier (visa restriction, bench post, course) — never saved</text>

  <!-- Row 5: duplicate -->
  <rect x="20" y="190" width="110" height="22" rx="11" fill="#ff9800"/>
  <text x="30" y="205" font-size="11" font-weight="600" fill="#fff">🔄 Duplicate</text>
  <text x="300" y="205" font-size="12" fill="#455a64">Same URL or ≥85% similar text already saved</text>

  <!-- Score pills -->
  <rect x="20" y="230" width="58" height="20" rx="10" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="29" y="244" font-size="11" font-weight="600" fill="#2e7d32">⭐ 78%</text>
  <rect x="86" y="230" width="44" height="20" rx="10" fill="#fffde7" stroke="#ffe082"/>
  <text x="97" y="244" font-size="11" font-weight="600" fill="#f57f17">52%</text>
  <rect x="138" y="230" width="44" height="20" rx="10" fill="#f5f5f5" stroke="#e0e0e0"/>
  <text x="149" y="244" font-size="11" font-weight="600" fill="#757575">31%</text>
  <text x="300" y="244" font-size="12" fill="#455a64">Confidence pill: green ≥70 · yellow ≥45 · gray below. Hover shows fired signals</text>

  <!-- AI tags -->
  <rect x="20" y="266" width="56" height="20" rx="4" fill="#ede9fe"/>
  <text x="28" y="280" font-size="10" fill="#7c3aed">⏳ AI…</text>
  <rect x="84" y="266" width="130" height="20" rx="4" fill="#d1fae5"/>
  <text x="92" y="280" font-size="10" fill="#065f46">🤖 DevOps Engineer 🛂</text>
  <rect x="222" y="266" width="60" height="20" rx="4" fill="#fee2e2"/>
  <text x="230" y="280" font-size="10" fill="#b91c1c">❌ AI fail</text>
  <text x="300" y="280" font-size="12" fill="#455a64">AI status: pending → extracted titles (🛂 = visa info found) → error</text>

  <!-- Reprocess -->
  <rect x="20" y="302" width="42" height="20" rx="4" fill="#ede9fe"/>
  <text x="27" y="316" font-size="10" fill="#7c3aed">↻ AI</text>
  <text x="300" y="316" font-size="12" fill="#455a64">Re-run AI for a saved post (bypasses caches) and fill missing Notion fields</text>
</svg>
