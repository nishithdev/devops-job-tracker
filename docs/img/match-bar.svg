<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Post card -->
  <rect x="10" y="10" width="740" height="270" rx="10" fill="#ffffff" stroke="#e0e0e0"/>
  <!-- Author row -->
  <circle cx="46" cy="46" r="20" fill="#cfd8dc"/>
  <rect x="78" y="32" width="170" height="11" rx="5" fill="#b0bec5"/>
  <rect x="78" y="50" width="110" height="9" rx="4" fill="#e0e0e0"/>

  <!-- Control bar (injected by extension) -->
  <rect x="26" y="78" width="708" height="34" rx="4" fill="#2e7d32" opacity="0.05"/>
  <rect x="26" y="78" width="3" height="34" fill="#2e7d32"/>

  <!-- Hiring badge -->
  <rect x="38" y="84" width="236" height="22" rx="11" fill="#2e7d32"/>
  <text x="48" y="99" font-size="11" font-weight="600" fill="#ffffff">🔥 Hiring · devops, terraform + hiring</text>

  <!-- Match counter -->
  <rect x="282" y="85" width="72" height="20" rx="10" fill="#2e7d32" opacity="0.1" stroke="#2e7d32" stroke-opacity="0.3"/>
  <text x="294" y="99" font-size="11" font-weight="700" fill="#2e7d32">3 matches</text>

  <!-- Score pill (high) -->
  <rect x="362" y="85" width="58" height="20" rx="10" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="371" y="99" font-size="11" font-weight="600" fill="#2e7d32">⭐ 72%</text>

  <!-- AI tag -->
  <rect x="428" y="85" width="150" height="20" rx="4" fill="#d1fae5"/>
  <text x="436" y="99" font-size="10" fill="#065f46">🤖 DevOps Engineer 🛂</text>

  <!-- Notion icon -->
  <rect x="586" y="85" width="20" height="20" rx="4" fill="#ffffff" stroke="#2d2d2d"/>
  <text x="590" y="100" font-size="13" font-weight="700" fill="#2d2d2d">N</text>

  <!-- Reprocess button -->
  <rect x="612" y="85" width="42" height="20" rx="4" fill="#ede9fe"/>
  <text x="619" y="99" font-size="10" fill="#7c3aed">↻ AI</text>

  <!-- Open button -->
  <rect x="662" y="85" width="62" height="20" rx="4" fill="#1565c0"/>
  <text x="672" y="99" font-size="11" font-weight="600" fill="#ffffff">Open ↗</text>

  <!-- Post text with keyword highlights -->
  <text x="30" y="140" font-size="13" fill="#333">We are</text>
  <rect x="82" y="128" width="42" height="17" rx="2" fill="#c8e6c9"/>
  <text x="84" y="140" font-size="13" fill="#1b5e20">hiring</text>
  <text x="130" y="140" font-size="13" fill="#333">a Senior</text>
  <rect x="185" y="128" width="56" height="17" rx="2" fill="#fff59d"/>
  <text x="187" y="140" font-size="13" fill="#333">DevOps</text>
  <text x="247" y="140" font-size="13" fill="#333">Engineer to build our cloud platform.</text>

  <text x="30" y="166" font-size="13" fill="#333">Must have:</text>
  <text x="30" y="190" font-size="13" fill="#333">•</text>
  <rect x="44" y="178" width="70" height="17" rx="2" fill="#fff59d"/>
  <text x="46" y="190" font-size="13" fill="#333">terraform</text>
  <text x="118" y="190" font-size="13" fill="#333">and</text>
  <rect x="148" y="178" width="80" height="17" rx="2" fill="#fff59d"/>
  <text x="150" y="190" font-size="13" fill="#333">kubernetes</text>
  <text x="232" y="190" font-size="13" fill="#333">— 5+ years of experience</text>
  <text x="30" y="214" font-size="13" fill="#333">• Remote OK · $85/hr · apply: jobs@acme.example.com</text>

  <!-- Legend -->
  <line x1="26" y1="238" x2="734" y2="238" stroke="#eeeeee"/>
  <rect x="30" y="252" width="12" height="12" rx="2" fill="#fff59d"/>
  <text x="48" y="262" font-size="11" fill="#666">DevOps keyword</text>
  <rect x="160" y="252" width="12" height="12" rx="2" fill="#c8e6c9"/>
  <text x="178" y="262" font-size="11" fill="#666">Hiring signal</text>
  <rect x="280" y="252" width="12" height="12" rx="2" fill="#ffcdd2"/>
  <text x="298" y="262" font-size="11" fill="#666">Invalid keyword</text>
  <text x="420" y="262" font-size="11" fill="#999">Bar is injected above the post text on every matched post</text>
</svg>
